<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="The Frequency | by thatAfro" />
	<meta name="keywords" content="Interactive Mixtape, The Frequency, thatAfro, thatAfro, mixtape, interactive, Music, Songs" />
	<meta name="author" content="Hikwa Mehluli - thatAfro" />
	<title>The Frequency | by thatAfro</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Homemade+Apple&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet">
	<!-- <link rel="icon" type="image/png" href="img/favicon.png" /> -->
</head>

<body class="love-theme">
	<div class="sidebar-overlay" id="sidebarOverlay"></div>

	<section class="sidebar-menu" id="sidebarMenu">
		<section class="sidebar-menu-close" id="sidebarClose">
			✕
		</section>

		<h2 id="music-genre-title"></h2>

		<h3 id="side-a-title"></h3>
		<ul id="side-a-list">
		</ul>

		<h3 id="side-b-title"></h3>
		<ul id="side-b-list">
		</ul>

		<div class="sidebar-contact">
			<p class="sidebar-contact-text">Holla @thatAfro, I am all ears</p>
			<div class="sidebar-contact-icons" id="sidebarContact"></div>
		</div>
	</section>

	<section class="sidebar-menu-open" id="sidebarOpen">
		☰
	</section>

	<section class="loading" id="mix-tape">
		<div class="switch-tape">
			<div class="tape-container">
				<div class="tape-mechanics">
					<div class="tape-wheels left-wheel">
						<div></div>
					</div>
					<div class="tape-wheels right-wheel">
						<div></div>
					</div>
				</div>
				<div class="tape-cover side-a-of-tape">
					<div class="tape-side-letter">A</div>
					<div class="tape-name"></div>
				</div>
				<div class="tape-cover side-b-of-tape">
					<div class="tape-side-letter">B</div>
					<div class="tape-name"></div>
				</div>
			</div>
		</div>
		<div class="pre-loader-container">
			<div class="pre-loader"></div>
			<span class="percentage">0%</span>
		</div>
	</section>

	<footer>
		<a href="https://thatafro.netlify.app">Made with <i class="icon-heart"></i> by thatAfro</a>
	</footer>

	<script src="js/main.js"></script>
</body>

</html>
